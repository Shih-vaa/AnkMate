<!doctype html>
<html lang="en">
<head>
  {% include "web/_head.html" %}
  <title>No school access - {{ PRODUCT_NAME }}</title>
</head>
<body>
<main class="auth">
  <div class="card">
    <h1>No school linked</h1>
    <p class="muted">Your account isn't linked to a school yet. Please contact the school office.</p>
    {% if user.is_staff %}<p><a href="{% url 'admin:index' %}">Open the admin site</a></p>{% endif %}
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn secondary block" type="submit">Log out</button></form>
  </div>
</main>
</body>
</html>
